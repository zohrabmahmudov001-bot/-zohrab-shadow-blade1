  const f=FOG.getContext('2d');for(let i=0;i<46;i++){const y=rnd()*34|0,x=rnd()*LW,w=30+rnd()*70;[0,-LW].forEach(o=>{f.fillStyle='rgba(130,160,240,.08)';f.fillRect(x+o,y,w,2);f.fillStyle='rgba(130,160,240,.05)';f.fillRect(x+o+4,y+2,w-10,1)})}
  // məşəl parıltısı
  const g=GLOW.getContext('2d');g.fillStyle='#4a8cff';for(let r=28;r>0;r-=1){g.globalAlpha=.03;for(let y=-r;y<=r;y++)for(let x=-r;x<=r;x++)if(x*x+y*y<=r*r)g.fillRect(30+x,30+y,1,1)}
})();

/* ================= 3x5 RƏQƏM ŞRİFTİ ================= */
const GL={0:'111101101101111',1:'010110010010111',2:'111001111100111',3:'111001111001111',4:'101101111001001',5:'111100111001111',6:'111100111101111',7:'111001001001001',8:'111101111101111',9:'111101111001111','+':'000010111010000'};
function num(c,s,x,y,k){[[1,1,'#000'],[0,0,k]].forEach(([dx,dy,col])=>{c.fillStyle=col;[...s].forEach((ch,i)=>{const g=GL[ch];for(let j=0;j<15;j++)if(g[j]==='1')c.fillRect(x+dx+i*4+j%3,y+dy+(j/3|0),1,1)})})}

/* ================= OYUN VƏZİYYƏTİ ================= */
const K={},T={};
addEventListener('keydown',e=>{K[e.code]=1;if(e.code.startsWith('Arrow')||e.code==='Space')e.preventDefault()});
addEventListener('keyup',e=>K[e.code]=0);
document.querySelectorAll('[data-k]').forEach(b=>{const k=b.dataset.k,on=e=>{e.preventDefault();T[k]=1;b.classList.add('on')},off=()=>{T[k]=0;b.classList.remove('on')};b.addEventListener('pointerdown',on);['pointerup','pointercancel','pointerleave'].forEach(n=>b.addEventListener(n,off))});
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('gesturestart',e=>e.preventDefault());
const inp=()=>({l:K.ArrowLeft||K.KeyA||T.l,r:K.ArrowRight||K.KeyD||T.r,j:K.ArrowUp||K.KeyW||K.Space||T.j,a:K.KeyJ||K.KeyZ||K.KeyX||T.a,d:K.KeyK||K.ShiftLeft||K.KeyC||T.d});

let view='sel',running=false,P,ST,WPN,bullets=[],enemies,fx,slashes,texts,trails,wave,toSpawn,spawnCD,clearT,score,comboHits,comboT,hitstop,shake,pt=0,jh=0;
let best=0;try{best=+localStorage.getItem('sb_best')||0}catch(e){}

function newGame(){
  const ch=CHARS[sel],s=ch.stats;WPN=WP[ch.wp];bullets=[];
  ST={maxhp:60+s.can*15,dmg:8+s.zerer*3,spd:1.2+s.suret*.14,def:s.mud*.05};
  P={x:160,y:GY,vx:0,vy:0,face:1,hp:ST.maxhp,en:100,atkT:0,atkMax:15,combo:0,comboT:0,dashT:0,dashCD:0,inv:0,hurtT:0,fl:0,anim:0,ground:true,dead:0,mv:0,pal:ch.pal,wp:ch.wp,sc:1};
  enemies=[];fx=[];slashes=[];texts=[];trails=[];wave=0;toSpawn=0;spawnCD=0;clearT=0;score=0;comboHits=0;comboT=0;hitstop=0;shake=0;
  nextWave();
}
function banner(s){const b=$('banner');b.textContent=s;b.classList.remove('show');void b.offsetWidth;b.classList.add('show')}
function nextWave(){
  wave++;clearT=0;toSpawn=3+wave*2;spawnCD=50;
  if(wave%5===0){toSpawn=Math.max(2,wave>>1);spawn('boss')}
  banner(wave%5===0?'DALĞA '+wave+'\nBOSS!':'DALĞA '+wave);
}
function spawn(type){
  const d=ENM[type],side=Math.random()<.5,m=1+(wave-1)*.1;
  enemies.push({...d,type,hp:Math.round(d.hp*m),maxhp:Math.round(d.hp*m),dmg:Math.round(d.dmg*(1+(wave-1)*.04)),x:side?LW-6:6,y:GY,vx:0,face:side?-1:1,st:'move',t:0,cd:40+Math.random()*40,sg:Math.random()<.5?-1:1,hurtT:0,fl:0,anim:0,dead:0,deadT:0,mv:0,en:1});
  const e=enemies[enemies.length-1];dust(e.x,GY,8,'#8fcaff');
}

/* ---- effektlər ---- */
function spark(x,y,n,heavy){
  fx.push({k:'star',x,y,life:5,big:heavy});
  for(let i=0;i<n;i++){const a=Math.random()*6.28,s=1+Math.random()*(heavy?3.6:2.4);fx.push({k:'p',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-.8,g:.12,life:14+Math.random()*10,c:['#fff','#bfe3ff','#ffd86b','#3d8bff'][i&3],z:i%5?1:2})}
}
function dust(x,y,n,c='#5a6a9a'){for(let i=0;i<n;i++)fx.push({k:'p',x:x+(Math.random()-.5)*8,y:y-1,vx:(Math.random()-.5)*1.6,vy:-Math.random()*.8,g:.02,life:10+Math.random()*8,c,z:1})}

/* ---- döyüş ---- */
function hurtE(e,d,kb,heavy){
  e.hp-=d;e.fl=5;
  if(!e.armor||heavy){e.hurtT=heavy?22:13;e.vx=kb;e.st='move';e.cd=28}else{e.x+=kb*.5}
  hitstop=Math.max(hitstop,heavy?8:4);shake=Math.max(shake,heavy?5:2);
  spark(e.x,e.y-20*e.sc,heavy?16:9,heavy);
  texts.push({s:''+d,x:e.x-4,y:e.y-48*e.sc,life:40,c:heavy?'#ffd86b':'#fff'});
  snd(heavy?150:210,50,.1,'square',.06);
  if(e.hp<=0){
    e.dead=1;e.hp=0;e.vx=kb*.8;const bonus=comboHits>=5?Math.round(e.pts*.25):0;
    score+=e.pts+bonus;hitstop=Math.max(hitstop,10);shake=Math.max(shake,6);spark(e.x,e.y-20*e.sc,26,1);
    texts.push({s:'+'+(e.pts+bonus),x:e.x-8,y:e.y-60*e.sc,life:55,c:'#ffd86b'});snd(130,30,.3,'sawtooth',.07);
    if(Math.random()<.18&&!e.boss)P.hp=Math.min(ST.maxhp,P.hp+12);
  }
}
function hurtP(d,dir){
  const p=P;if(p.inv>0||p.dead)return;
  p.hp-=d*(1-ST.def);p.hurtT=14;p.inv=48;p.vx=dir*2.4;p.vy=-2;p.atkT=0;p.fl=4;p.ground=false;
  hitstop=5;shake=6;spark(p.x,p.y-20,12,0);snd(120,40,.2,'sawtooth',.07);comboHits=0;
  if(p.hp<=0){p.hp=0;p.dead=1;snd(200,30,.6,'sawtooth',.08)}
}
function updP(){
  const i=inp(),p=P;p.anim++;
  if(p.dead){p.dead++;if(p.dead>85)endGame();return}
  p.fl--;p.inv--;p.hurtT--;p.dashCD--;p.comboT--;p.mv=0;
  if(p.comboT<=0)p.combo=0;
  if(p.hurtT>0){p.x+=p.vx;p.vx*=.9}
  else if(p.dashT>0){p.dashT--;p.x+=p.face*5;p.mv=1;if(p.dashT%2===0)trails.push({x:p.x,y:p.y,face:p.face,life:10})}
  else{
    if(i.d&&p.dashCD<=0&&p.en>=25){p.dashT=9;p.dashCD=32;p.en-=25;p.inv=Math.max(p.inv,13);p.atkT=0;if(i.l)p.face=-1;if(i.r)p.face=1;snd(280,700,.12,'triangle',.06);dust(p.x,p.y,6)}
    if(i.a&&p.atkT<=3){p.combo=p.comboT>0?p.combo%3+1:1;p.comboT=48;p.atkMax=p.combo===3?WPN.a3:WPN.a1;p.atkT=p.atkMax;if(i.l)p.face=-1;if(i.r)p.face=1}
    if(p.atkT>0){
      p.atkT--;const f=p.atkT/p.atkMax;if(p.atkT===Math.round(p.atkMax*.6))pStrike();
      if(f<.6&&f>.3)p.x+=p.face*(WPN.rg?-.2:p.combo===3?1.6:.7);
    }else{if(i.l){p.x-=ST.spd;p.face=-1;p.mv=1}else if(i.r){p.x+=ST.spd;p.face=1;p.mv=1}}
    if(i.j&&!jh&&p.ground){p.vy=-5.8;p.ground=false;dust(p.x,p.y,5);snd(300,520,.08,'triangle',.04)}
  }
  jh=i.j;
  p.vy+=.4;p.y+=p.vy;
  if(p.y>=GY){if(!p.ground&&p.vy>3)dust(p.x,GY,7);p.y=GY;p.vy=0;p.ground=true}else p.ground=false;
  p.x=Math.max(10,Math.min(LW-10,p.x));p.en=Math.min(100,p.en+.16);
}
function updE(e){
  e.anim++;e.fl--;
  if(e.dead){e.deadT++;e.x+=e.vx;e.vx*=.9;return}
  if(e.hurtT>0){e.hurtT--;e.x+=e.vx;e.vx*=.86;e.x=Math.max(4,Math.min(LW-4,e.x));return}
  const dx=P.x-e.x,ad=Math.abs(dx),dir=dx>=0?1:-1;e.t--;e.mv=0;
  if(e.st==='move'){
    e.face=dir;e.cd--;
    const want=e.can?e.reach-6:50+e.slot*14;
    if(ad>want+3){e.x+=dir*e.spd;e.mv=1}else if(ad<want-6){e.x-=dir*e.spd*.6;e.mv=1}
    else if(!e.can){e.x+=e.sg*e.spd*.35;e.mv=1;if(Math.random()<.012)e.sg*=-1}
    if(e.type==='fast'&&P.atkT>8&&ad<34&&Math.random()<.04){e.vx=-dir*3.2;e.hurtT=9}
    if(e.can&&e.cd<=0&&ad<=e.reach+2&&!P.dead&&Math.abs(P.y-e.y)<20){e.st='wind';e.t=e.wind;snd(760,760,.05,'square',.025)}
  }else if(e.st==='wind'){e.face=dir;if(e.t<=0){e.st='strike';e.t=9;e.done=0}}
  else if(e.st==='strike'){
    e.x+=e.face*(e.type==='fast'?1.8:.6);e.mv=1;
    if(!e.done&&e.t<=6){e.done=1;snd(260,100,.08,'sawtooth',.04);const d2=(P.x-e.x)*e.face;if(d2>-6&&d2<e.reach+6&&Math.abs(P.y-e.y)<18)hurtP(e.dmg,e.face)}
    if(e.t<=0){e.st='rec';e.t=16}
  }else if(e.st==='rec'&&e.t<=0){e.st='move';e.cd=e.cdMax+Math.random()*40}
  e.x=Math.max(4,Math.min(LW-4,e.x));
}
function update(){
  updP();bulletsUp();
  const live=enemies.filter(e=>!e.dead).sort((a,b)=>Math.abs(a.x-P.x)-Math.abs(b.x-P.x)),maxA=wave<3?1:wave<7?2:3;
  live.forEach((e,i)=>{e.can=i<maxA||e.st==='wind'||e.st==='strike';e.slot=i});
  enemies.forEach(updE);
  live.forEach((a,i)=>live.slice(i+1).forEach(b=>{const d=b.x-a.x;if(Math.abs(d)<13){const m=(13-Math.abs(d))/2*(d>=0?1:-1);a.x-=m;b.x+=m}}));
  enemies=enemies.filter(e=>!(e.dead&&e.deadT>55));
  if(toSpawn>0){if(--spawnCD<=0&&live.length<4+Math.min(3,wave>>1)){const r=Math.random();spawn(wave>=3&&r>.8?'tank':wave>=2&&r>.5?'fast':'grunt');toSpawn--;spawnCD=60}}
  else if(!live.length&&!P.dead){if(++clearT===1){const b=wave*50;score+=b;P.hp=Math.min(ST.maxhp,P.hp+ST.maxhp*.25);texts.push({s:'+'+b,x:P.x-6,y:P.y-44,life:60,c:'#7fe08a'})}if(clearT>130)nextWave()}
  if(comboT>0){if(--comboT<=0)comboHits=0}
  if(Math.random()<.05)fx.push({k:'p',x:Math.random()*LW,y:GY-Math.random()*60,vx:.15,vy:-.12,g:0,life:120,c:'#6fa8ff',z:1});
  if(Math.random()<.1){const x=Math.random()<.5?24:296;fx.push({k:'p',x:x+(Math.random()-.5)*3,y:64,vx:(Math.random()-.5)*.3,vy:-.5,g:0,life:30,c:'#7fc0ff',z:1})}
  hud();
}
function fxUpdate(){
  fx.forEach(f=>{f.life--;if(f.k==='p'){f.x+=f.vx;f.y+=f.vy;f.vy+=f.g}});fx=fx.filter(f=>f.life>0);
  slashes.forEach(s=>s.t--);slashes=slashes.filter(s=>s.t>0);
  texts.forEach(t=>{t.life--;t.y-=.35});texts=texts.filter(t=>t.life>0);
  trails.forEach(t=>t.life--);trails=trails.filter(t=>t.life>0);shake*=.84;
}
function hud(){
  $('hp').style.width=(P.hp/ST.maxhp*100)+'%';$('en').style.width=P.en+'%';
  $('sc').textContent=score;$('wv').textContent='DALĞA '+wave;
  $('mid').textContent=comboHits>1?comboHits+' VURUŞ':'';
}
function endGame(){
  running=false;if(score>best){best=score;try{localStorage.setItem('sb_best',best)}catch(e){}}
  $('fs').textContent='XAL: '+score+'  ·  DALĞA: '+wave;$('bs').textContent='REKORD: '+best;
  $('over').classList.add('on');
}

/* ================= ÇƏKİM ================= */
function poseP(p){if(p.dead)return'dead';if(p.hurtT>0)return'hurt';if(p.atkT>0){const f=p.atkT/p.atkMax;return f>.6?'wind':f>.3?'strike':'rec'}if(!p.ground)return'air';return p.mv?'run':'idle'}
function poseE(e){if(e.dead)return'dead';if(e.hurtT>0)return'hurt';if(e.st==='wind')return'wind';if(e.st==='strike')return'strike';if(e.st==='rec')return'rec';return e.mv?'run':'idle'}
function slashFx(s){
  const prog=1-s.t/s.m,R0=(s.big?42:32)*WPN.r1/36,n=16,ah=-1.5+prog*2.6;
  for(let pass=0;pass<(s.big?2:1);pass++){
    const R1=R0-pass*7;
    for(let k=0;k<n;k++){
      const f=k/n,a=ah-1.2*(1-f),px=s.x+s.f*Math.cos(a)*R1,py=s.y+Math.sin(a)*R1*.85+(s.c===2?9:0);
      ctx.globalAlpha=Math.min(1,s.t/s.m*1.6)*(.35+f*.65);
      ctx.fillStyle=f>.82?'#fff':f>.5?P.pal.glow:P.pal.accent;
      const z=f>.5?3:2;ctx.fillRect(Math.round(px-(s.f<0?z:0)),Math.round(py),z,z);
    }
  }ctx.globalAlpha=1;
}
function draw(){
  const c=ctx;let sx=0,sy=0;if(shake>.3){sx=Math.round((Math.random()-.5)*shake*2);sy=Math.round((Math.random()-.5)*shake*2)}
  c.drawImage(BG,sx-6,sy-6);c.save();c.translate(sx,sy);
  // fon dumanı + məşəllər
  const fo=Math.floor(pt*.12%LW);c.drawImage(FOG,-fo,GY-30);c.drawImage(FOG,LW-fo,GY-30);
  [24,296].forEach(x=>{c.globalAlpha=.55+.15*Math.sin(pt/4+x);c.drawImage(GLOW,x-30,66-30);c.globalAlpha=1;const f=Math.sin(pt/3+x)*1.5|0;c.fillStyle='#2f7bff';c.fillRect(x-3,62+f,6,9-f);c.fillStyle='#8fcaff';c.fillRect(x-2,64+f,4,6-f);c.fillStyle='#fff';c.fillRect(x-1,67,2,3);c.fillStyle='#2f7bff';c.fillRect(x-1,59+f,2,3)});
  // kölgələr
  [P,...enemies].forEach(o=>{const w=Math.round(16*(o.sc||1)*(1-(GY-o.y)/90));c.fillStyle='rgba(0,0,0,.5)';c.fillRect(Math.round(o.x-w/2),GY+1,w,2)});
  trails.forEach(t=>fig(c,{x:t.x,y:t.y,face:t.face,sc:1,pal:P.pal,wp:P.wp,fl:0},'strike',0,t.life/28));
  enemies.filter(e=>e.dead).forEach(e=>{if(!(e.deadT>35&&(e.deadT>>1&1)))fig(c,e,'dead',e.anim)});
  enemies.filter(e=>!e.dead).forEach(e=>{
    fig(c,e,poseE(e),e.anim);
    if(!e.boss){const w=18,x=Math.round(e.x-w/2),y=Math.round(e.y-47*e.sc);c.fillStyle='#000';c.fillRect(x-1,y-1,w+2,4);c.fillStyle='#d6403a';c.fillRect(x,y,Math.ceil(w*e.hp/e.maxhp),2)}
  });
  if(!(P.inv>0&&!P.dead&&(pt>>1&1)&&P.dashT<=0))fig(c,{...P,combo:P.combo},poseP(P),P.anim);
  drawBullets();slashes.forEach(slashFx);
  fx.forEach(f=>{
    if(f.k==='p'){c.globalAlpha=Math.min(1,f.life/8);c.fillStyle=f.c;c.fillRect(Math.round(f.x),Math.round(f.y),f.z,f.z);c.globalAlpha=1}
    else{const r=f.big?9:6,k=f.life>3?'#fff':'#8fcaff';c.fillStyle=k;c.fillRect(Math.round(f.x-1),Math.round(f.y-r),2,r*2);c.fillRect(Math.round(f.x-r),Math.round(f.y-1),r*2,2);c.fillRect(Math.round(f.x-3),Math.round(f.y-3),6,6)}
  });
  c.globalAlpha=.4;c.drawImage(FOG,-fo*2%LW,GY+10);c.drawImage(FOG,LW-fo*2%LW,GY+10);c.globalAlpha=1;
  texts.forEach(t=>{c.globalAlpha=Math.min(1,t.life/14);num(c,t.s,Math.round(t.x),Math.round(t.y),t.c);c.globalAlpha=1});
  c.restore();
  const boss=enemies.find(e=>e.boss&&!e.dead);
  if(boss){c.fillStyle='#000';c.fillRect(79,9,162,7);c.fillStyle='#3a1018';c.fillRect(80,10,160,5);c.fillStyle='#e6b84a';c.fillRect(80,10,Math.ceil(160*boss.hp/boss.maxhp),5)}
}
let pp=0;
function drawPrev(){
  const c=pctx;c.clearRect(0,0,96,64);const ch=CHARS[sel];
  c.fillStyle='#2f7bff55';c.fillRect(8,60,50,2);c.fillStyle='#8fcaff77';c.fillRect(14,61,38,1);
  const ps=['idle','idle','idle','run','run','wind','strike','rec'];
  fig(c,{x:30,y:60,face:1,sc:1,pal:ch.pal,wp:ch.wp,fl:0,combo:1},ps[pp/22&7],pp);
}
/* ================= MENYU ================= */
function crop(el,cx,cy,k,im){el.style.backgroundImage=im?"var(--img2)":"var(--img)";const w=el.clientWidth,h=el.clientHeight;el.style.backgroundSize=(IW*k)+'px auto';el.style.backgroundPosition=(w/2-cx*k)+'px '+(h/2-cy*k)+'px'}
function buildSel(){
  const ch=CHARS[sel];$('nm').textContent=ch.name;$('tags').textContent=ch.tags;$('q').textContent=ch.quote;
  const L=[['CAN','can'],['ZƏRƏR','zerer'],['SÜRƏT','suret'],['MÜDAFİƏ','mud']];
  $('stats').innerHTML=L.map(([n,k])=>`<div class="st"><b>${n}</b><div>${[0,1,2,3,4,5].map(i=>`<span class="seg"><i style="--f:${Math.max(0,Math.min(1,ch.stats[k]-i))*100}%"></i></span>`).join('')}</div></div>`).join('');
  $('slots').innerHTML=CHARS.map((c,i)=>`<div class="sl ${i===sel?'on':''}"></div>`).join('');
  document.querySelectorAll('.sl').forEach((el,i)=>{el.onclick=()=>{sel=i;buildSel()};crop(el,CHARS[i].fc[0],CHARS[i].fc[1],.55,CHARS[i].img)});
  const a=$('art');crop(a,ch.pt[0],ch.pt[1],Math.max(.5,a.clientHeight/ch.ph),ch.img);
}
addEventListener('resize',()=>{if(view==='sel')buildSel()});
function show(v){view=v;$('sel').classList.toggle('on',v==='sel');$('game').classList.toggle('on',v==='game');$('over').classList.remove('on')}
$('pick').onclick=()=>{snd(500,900,.15,'triangle',.06);show('game');newGame();running=true};
$('again').onclick=()=>{$('over').classList.remove('on');newGame();running=true};
$('tosel').onclick=()=>show('sel');
buildSel();

/* ================= DÖNGÜ (sabit 60 FPS, 120Hz ekranlarda da eyni sürət) ================= */
let last=0,acc=0;
function frame(ts){
  const dt=Math.min(50,ts-last);last=ts;acc+=dt;
  while(acc>=16.667){
    acc-=16.667;pt++;pp++;
    if(view==='game'&&running){if(hitstop>0){hitstop--;fxUpdate()}else{update();fxUpdate()}}
    else if(view==='game')fxUpdate();
  }
  if(view==='game')draw();else drawPrev();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
